document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8d808029-fce9-4a2b-b5d5-3b3b1aef9a90\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8a45ecfd-40f6-43bb-ae8f-9a8e4d5efef6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8d808029-fce9-4a2b-b5d5-3b3b1aef9a90\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8a45ecfd-40f6-43bb-ae8f-9a8e4d5efef6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8d808029-fce9-4a2b-b5d5-3b3b1aef9a90\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8a45ecfd-40f6-43bb-ae8f-9a8e4d5efef6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================\n   SIMPLEX — Design System v3\n   Blanco + Azul Simplex + Amarillo accent\n   Mantiene nombres de variables legacy para compat.\n   ============================================ */\n\n:root {\n  /* === Brand (v3 — from real Simplex logo) === */\n  --blue: #1E6BA8;\n  --blue-2: #2A7FC5;\n  --blue-3: #174F80;\n  --blue-ink: #0F3350;\n  --blue-soft: #6BAEDB;\n  --blue-softer: #B8D9F0;\n  --blue-wash: #E8F2FA;\n  --yellow: #F5B301;\n  --yellow-2: #FFC93C;\n  --yellow-soft: #FFEFB8;\n\n  /* === Legacy aliases — mapped to v3 palette === */\n  /* Old pages use --ink for dark text/bg; we map to deep navy.\n     Where old pages used cream bg, we map to white/paper. */\n  --ink: #0F3350;             /* deep navy text */\n  --ink-2: #174F80;\n  --ink-3: #1E6BA8;\n  --cream: #FFFFFF;           /* was warm off-white → now pure white */\n  --cream-2: #F5F8FB;\n  --paper: #FBFCFD;\n  --paper-2: #F5F8FB;\n\n  /* Old --orange / --orange-2 / --orange-ink → now blue accents */\n  --orange: #1E6BA8;          /* primary accent → Simplex blue */\n  --orange-2: #2A7FC5;\n  --orange-ink: #174F80;\n  --electric: #F5B301;        /* rare secondary → yellow */\n\n  --line: rgba(15, 51, 80, 0.10);\n  --line-2: rgba(15, 51, 80, 0.05);\n  --line-strong: rgba(15, 51, 80, 0.18);\n  --mute: rgba(15, 51, 80, 0.62);\n  --mute-2: rgba(15, 51, 80, 0.42);\n\n  /* On-ink (dark sections) */\n  --on-ink: #FFFFFF;\n  --on-ink-mute: rgba(255, 255, 255, 0.72);\n  --on-ink-line: rgba(255, 255, 255, 0.18);\n\n  /* Type */\n  --font-display: \"Outfit\", \"Instrument Serif\", \"Georgia\", serif;\n  --font-sans: \"Outfit\", \"Geist\", \"Inter Tight\", \"Helvetica Neue\", system-ui, sans-serif;\n  --font-mono: \"JetBrains Mono\", \"IBM Plex Mono\", ui-monospace, monospace;\n\n  /* Radii */\n  --r-sm: 8px;\n  --r-md: 14px;\n  --r-lg: 22px;\n  --r-xl: 32px;\n  --r-pill: 999px;\n\n  /* Motion */\n  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body {\n  background: #FFFFFF;\n  color: var(--ink);\n  font-family: var(--font-sans);\n  font-size: 16px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody { overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }\n\n::selection { background: var(--blue); color: #FFFFFF; }\n\n/* ============ Typography ============ */\n.display {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  letter-spacing: -0.03em;\n  line-height: 0.98;\n}\n.display-xxl { font-family: var(--font-sans); font-weight: 600; font-size: clamp(72px, 12vw, 220px); line-height: 0.92; letter-spacing: -0.035em; color: var(--blue-3); }\n.display-xl  { font-family: var(--font-sans); font-weight: 600; font-size: clamp(56px, 8vw, 140px);  line-height: 0.95; letter-spacing: -0.03em;  color: var(--blue-3); }\n.display-lg  { font-family: var(--font-sans); font-weight: 600; font-size: clamp(44px, 6vw, 96px);   line-height: 1.0;  letter-spacing: -0.025em; color: var(--blue-3); }\n.display-md  { font-family: var(--font-sans); font-weight: 600; font-size: clamp(32px, 4vw, 56px);   line-height: 1.05; letter-spacing: -0.02em;  color: var(--blue-3); }\n\n.italic { font-style: normal; color: var(--blue); position: relative; display: inline-block; }\n\n.eyebrow {\n  font-family: var(--font-mono);\n  text-transform: uppercase;\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  color: var(--blue);\n  font-weight: 500;\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n}\n.eyebrow::before {\n  content: \"\";\n  width: 6px; height: 6px;\n  background: var(--yellow);\n  border-radius: 50%;\n  flex-shrink: 0;\n}\n.eyebrow-on-ink { color: var(--on-ink-mute); }\n.eyebrow-on-ink::before { background: var(--yellow); }\n\n.body-lg { font-size: 20px; line-height: 1.5; letter-spacing: -0.01em; color: var(--ink); text-wrap: pretty; }\n.body-md { font-size: 16px; line-height: 1.6; color: var(--ink); text-wrap: pretty; }\n.mute { color: var(--mute); }\n\n/* ============ Layout ============ */\n.container {\n  width: 100%;\n  max-width: 1440px;\n  margin: 0 auto;\n  padding: 0 40px;\n}\n@media (max-width: 720px) { .container { padding: 0 20px; } }\n\n.section { padding: clamp(80px, 10vw, 160px) 0; }\n\n/* ============ Buttons ============ */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 13px 22px;\n  border-radius: var(--r-pill);\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  transition: transform .3s var(--ease), background .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease);\n  white-space: nowrap;\n}\n.btn-primary {\n  background: var(--blue);\n  color: #FFFFFF;\n  box-shadow: 0 8px 20px -10px rgba(30, 107, 168, 0.5);\n}\n.btn-primary:hover {\n  background: var(--blue-3);\n  color: #FFFFFF;\n  transform: translateY(-1px);\n  box-shadow: 0 12px 28px -10px rgba(30, 107, 168, 0.6);\n}\n.btn-ghost {\n  border: 1px solid var(--line-strong);\n  color: var(--ink);\n}\n.btn-ghost:hover {\n  background: var(--ink);\n  color: #FFFFFF;\n  border-color: var(--ink);\n}\n.btn-on-ink-primary {\n  background: var(--yellow);\n  color: var(--ink);\n}\n.btn-on-ink-primary:hover { background: #FFFFFF; color: var(--ink); }\n.btn-on-ink-ghost {\n  border: 1px solid var(--on-ink-line);\n  color: #FFFFFF;\n}\n.btn-on-ink-ghost:hover { background: #FFFFFF; color: var(--ink); border-color: #FFFFFF; }\n\n.btn-arrow { transition: transform .3s var(--ease); flex-shrink: 0; }\n.btn:hover .btn-arrow { transform: translateX(4px); }\n\n/* ============ Nav ============ */\n.nav {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 100;\n  padding: 18px 40px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  transition: background .4s var(--ease), backdrop-filter .4s var(--ease), border-color .4s var(--ease), padding .3s var(--ease);\n  border-bottom: 1px solid transparent;\n}\n.nav.scrolled {\n  padding-top: 12px; padding-bottom: 12px;\n  background: rgba(255, 255, 255, 0.85);\n  backdrop-filter: blur(24px) saturate(1.4);\n  -webkit-backdrop-filter: blur(24px) saturate(1.4);\n  border-bottom-color: var(--line-2);\n}\n.nav.on-ink.scrolled {\n  background: rgba(15, 51, 80, 0.8);\n  border-bottom-color: var(--on-ink-line);\n}\n.nav.on-ink .nav-logo { color: #FFFFFF; }\n.nav.on-ink .nav-logo .mark { background: var(--yellow); }\n@media (max-width: 720px) { .nav { padding: 14px 20px; } }\n\n.nav-logo {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: 24px;\n  letter-spacing: -0.02em;\n  color: var(--blue);\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  position: relative;\n}\n.nav-logo-wordmark {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: 26px;\n  letter-spacing: -0.02em;\n  color: var(--blue);\n  line-height: 1;\n  display: inline-flex;\n}\n.nav-logo-wordmark .i-wrap { position: relative; display: inline-block; }\n.nav-logo-wordmark .i-wrap .glyph { font-style: normal; position: relative; }\n/* Mask the native dot of the \"i\" */\n.nav-logo-wordmark .i-wrap::after {\n  content: \"\";\n  position: absolute;\n  top: -0.08em;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 0.55em;   .timeline-row { grid-template-columns: 80px 1fr; }\n  .timeline-row .tl-desc, .timeline-row .tl-arrow { display: none; }\n}\n.timeline-row > * { position: relative; z-index: 1; }\n.tl-year {\n  font-family: var(--font-mono);\n  font-size: 13px;\n  letter-spacing: 0.08em;\n  color: var(--blue);\n  font-weight: 500;\n}\n.tl-title {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: 28px;\n  line-height: 1.1;\n  color: var(--blue-3);\n  letter-spacing: -0.015em;\n}\n.tl-title .accent { color: var(--blue); }\n.tl-desc {\n  font-size: 15px;\n  color: var(--mute);\n  line-height: 1.55;\n  max-width: 520px;\n}\n.tl-arrow {\n  color: var(--mute-2);\n  transition: color .4s var(--ease), transform .4s var(--ease);\n  align-self: center;\n}\n.timeline-row:hover .tl-arrow { color: var(--blue); transform: translate(4px, -2px); }\n\n/* ============ Team banner ============ */\n.team-banner {\n  background: #FFFFFF;\n  color: var(--blue-3);\n  padding: clamp(80px, 10vw, 140px) 0;\n  position: relative;\n  overflow: hidden;\n  border-top: 1px solid var(--line);\n}\n.team-banner::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(ellipse 50% 40% at 85% 30%, rgba(30,107,168,0.08), transparent 60%),\n    radial-gradient(ellipse 50% 40% at 15% 80%, rgba(107,174,219,0.12), transparent 60%);\n  pointer-events: none;\n}\n.team-banner-inner { position: relative; z-index: 1; max-width: 1100px; }\n.team-banner h2 {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: clamp(44px, 7vw, 104px);\n  line-height: 0.96;\n  letter-spacing: -0.03em;\n  color: var(--blue-3);\n  max-width: 900px;\n  text-wrap: balance;\n  margin-top: 24px;\n}\n.team-banner h2 .accent {\n  color: var(--blue);\n  background-image: linear-gradient(var(--blue-3), var(--blue-3));\n  background-repeat: no-repeat;\n  background-size: 100% 3px;\n  background-position: 0 94%;\n  -webkit-box-decoration-break: clone;\n  box-decoration-break: clone;\n  padding-bottom: 2px;\n}\n.team-banner .team-cta { margin-top: 44px; }\n\n/* Tag helpers */\n.tag .dot { background: var(--yellow); }\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"nav-slot\"><\u002Fdiv>\n\n<header class=\"page-hero\" data-screen-label=\"01 Nosotros · Hero\">\n  <div class=\"container\">\n    <div class=\"page-hero-inner\">\n      <div>\n        <div class=\"tag reveal\"><span class=\"dot\"><\u002Fspan>Nosotros<\u002Fdiv>\n        <h1 class=\"reveal\">Un equipo que <span class=\"accent\">opera<\u002Fspan> como socio.<\u002Fh1>\n      <\u002Fdiv>\n      <p class=\"lede reveal\">Somos un equipo multidisciplinario argentino que construye infraestructura de digital commerce para las marcas más importantes de Latinoamérica. No somos agencia. No somos operador logístico. Somos ambas cosas, integradas en una sola operación.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section class=\"manifesto\" data-screen-label=\"02 Nosotros · Manifiesto\">\n  <div class=\"container\">\n    <blockquote class=\"reveal\">\n      Creemos que el digital commerce es un <span class=\"accent\">deporte de equipo<\u002Fspan>. Por eso integramos marketing, tecnología, soporte, logística y data bajo un mismo techo — para que nuestros clientes operen como una sola orquesta.\n    <\u002Fblockquote>\n    <div class=\"attribution reveal\">\n      <div class=\"avatar\"><img src=\"bbd4b262-1d80-48e9-8fcf-5791adf2ca16\" alt=\"Alejandro Gómez\"><\u002Fdiv>\n      <div>\n        <strong>Alejandro Gómez<\u002Fstrong>\n        <span>CEO · Wrexham FC<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"values\" data-screen-label=\"03 Nosotros · Valores\">\n  <div class=\"container\">\n    <div class=\"values-header reveal\">\n      <div class=\"tag\"><span class=\"dot\"><\u002Fspan>Cómo operamos<\u002Fdiv>\n      <h2>Seis principios que <span class=\"accent\">no negociamos<\u002Fspan>.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"values-grid\">\n      <div class=\"value reveal\">\n        <span class=\"value-num\">/ 01<\u002Fspan>\n        <div class=\"value-title\">Integración <span class=\"accent\">real<\u002Fspan><\u002Fdiv>\n        <p class=\"value-desc\">Los 5 servicios comparten herramientas, datos y rituales. El cliente ve una sola operación — no cinco proveedores.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"value reveal\">\n        <span class=\"value-num\">/ 02<\u002Fspan>\n        <div class=\"value-title\">Ownership del <span class=\"accent\">resultado<\u002Fspan><\u002Fdiv>\n        <p class=\"value-desc\">No entregamos entregables, entregamos KPIs. Nos medimos con las mismas métricas que nuestros clientes.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"value reveal\">\n        <span class=\"value-num\">/ 03<\u002Fspan>\n        <div class=\"value-title\">Data primero<\u002Fdiv>\n        <p class=\"value-desc\">Cada decisión — desde el pricing hasta la ruta de despacho — se toma con evidencia, no con intuición.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"value reveal\">\n        <span class=\"value-num\">/ 04<\u002Fspan>\n        <div class=\"value-title\">Velocidad <span class=\"accent\">argentina<\u002Fspan><\u002Fdiv>\n        <p class=\"value-desc\">Contexto complejo, decisiones rápidas. Construimos en semanas lo que otros tardan trimestres en planificar.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"value reveal\">\n        <span class=\"value-num\">/ 05<\u002Fspan>\n        <div class=\"value-title\">Transparencia <span class=\"accent\">radical<\u002Fspan><\u002Fdiv>\n        <p class=\"value-desc\">Compartimos dashboards, costos y aprendizajes en tiempo real. Lo bueno, lo malo y lo que estamos arreglando.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"value reveal\">\n        <span class=\"value-num\">/ 06<\u002Fspan>\n        <div class=\"value-title\">Escalabilidad<\u002Fdiv>\n        <p class=\"value-desc\">Lo que opera para una marca grande tiene que poder operar para una que recién arranca — y viceversa.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"timeline\" data-screen-label=\"04 Nosotros · Timeline\">\n  <div class=\"container\">\n    <div class=\"timeline-header reveal\">\n      <div class=\"tag\"><span class=\"dot\"><\u002Fspan>Nuestra historia<\u002Fdiv>\n      <h2>Trece años construyendo la <span class=\"accent\">infraestructura<\u002Fspan> del e-commerce argentino.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"timeline-list\">\n      <div class=\"timeline-row reveal\">\n        <div class=\"tl-year\">2013<\u002Fdiv>\n        <div class=\"tl-title\">Fundación<\u002Fdiv>\n        <div class=\"tl-desc\">Simplex nace en Buenos Aires como operador logístico especializado en e-commerce, en un mercado donde \"logística digital\" apenas existía como categoría.<\u002Fdiv>\n        <svg class=\"tl-arrow\" width=\"18\" height=\"18\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 11L11 3M11 3H5M11 3V9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"timeline-row reveal\">\n        <div class=\"tl-year\">2016<\u002Fdiv>\n        <div class=\"tl-title\">Primer cliente enterprise<\u002Fdiv>\n        <div class=\"tl-desc\">Cerramos nuestro primer contrato con una multinacional FMCG. La operación crece 4× en 12 meses.<\u002Fdiv>\n        <svg class=\"tl-arrow\" width=\"18\" height=\"18\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 11L11 3M11 3H5M11 3V9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"timeline-row reveal\">\n        <div class=\"tl-year\">2019<\u002Fdiv>\n        <div class=\"tl-title\">Lanzamos el <span class=\"accent\">S-System<\u002Fspan><\u002Fdiv>\n        <div class=\"tl-desc\">Consolidamos marketing, soporte e insights bajo un mismo techo. El modelo 360° queda formalizado.<\u002Fdiv>\n        <svg class=\"tl-arrow\" width=\"18\" height=\"18\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 11L11 3M11 3H5M11 3V9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"timeline-row reveal\">\n        <div class=\"tl-year\">2021<\u002Fdiv>\n        <div class=\"tl-title\">Centro operativo propio<\u002Fdiv>\n        <div class=\"tl-desc\">Inauguramos 7.500 m² de operación logística en el AMBA con capacidad para 5.000+ despachos diarios.<\u002Fdiv>\n        <svg class=\"tl-arrow\" width=\"18\" height=\"18\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 11L11 3M11 3H5M11 3V9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"timeline-row reveal\">\n        <div class=\"tl-year\">2024<\u002Fdiv>\n        <div class=\"tl-title\">+50 marcas activas<\u002Fdiv>\n        <div class=\"tl-desc\">Superamos la marca de 50 clientes enterprise. 300.000 unidades mensuales circulando por la operación.<\u002Fdiv>\n        <svg class=\"tl-arrow\" width=\"18\" height=\"18\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 11L11 3M11 3H5M11 3V9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"timeline-row reveal\">\n        <div class=\"tl-year\">2026<\u002Fdiv>\n        <div class=\"tl-title\">Expansión <span class=\"accent\">LATAM<\u002Fspan><\u002Fdiv>\n        <div class=\"tl-desc\">Lanzamos S-Solutions regionales. Empezamos a operar fulfillment y estrategia para marcas en mercados vecinos.<\u002Fdiv>\n        <svg class=\"tl-arrow\" width=\"18\" height=\"18\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 11L11 3M11 3H5M11 3V9\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"team-banner\" data-screen-label=\"05 Nosotros · CTA\">\n  <div class=\"container\">\n    <div class=\"team-banner-inner reveal\">\n      <div class=\"tag\"><span class=\"dot\"><\u002Fspan>Súmate al equipo<\u002Fdiv>\n      <h2>Buscamos gente que le guste <span class=\"accent\">operar en complejidad<\u002Fspan>.<\u002Fh2>\n      <div class=\"team-cta\">\n        <a href=\"sumate.html\" class=\"btn btn-primary\">\n          Ver oportunidades\n          <svg class=\"btn-arrow\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M1 7h12M8 2l5 5-5 5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div id=\"footer-slot\"><\u002Fdiv>\n<script src=\"71b180f5-c1c8-4bb6-a4d5-cb1e6fcf6fdc\"><\u002Fscript>\n<script>\nconst isFine = window.matchMedia('(pointer: fine)').matches;\n\n// Magnetic buttons\nif (isFine) {\n  document.querySelectorAll('.btn').forEach(btn => {\n    const strength = 0.25;\n    btn.addEventListener('mousemove', (e) => {\n      const rect = btn.getBoundingClientRect();\n      const x = e.clientX - rect.left - rect.width / 2;\n      const y = e.clientY - rect.top - rect.height / 2;\n      btn.style.transform = `translate(${x * strength}px, ${y * strength}px)`;\n    });\n    btn.addEventListener('mouseleave', () => { btn.style.transform = ''; });\n  });\n}\n\n// Value card radial follow\nif (isFine) {\n  document.querySelectorAll('.value').forEach(card => {\n    card.addEventListener('mousemove', (e) => {\n      const rect = card.getBoundingClientRect();\n      card.style.setProperty('--mx', ((e.clientX - rect.left) / rect.width) * 100 + '%');\n      card.style.setProperty('--my', ((e.clientY - rect.top) / rect.height) * 100 + '%');\n    });\n  });\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
